<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GuidelyEdu — Capture Intervention (Teacher)</title>
  <style>
    /* Spine: DESIGN.md Colors/Components; EXPERIENCE.md Flow 1 (UJ-1), Capture form */
    :root {
      --canvas: #F0F0F5;
      --surface: #FFFFFF;
      --primary: #5B63E6;
      --text: #1F2937;
      --muted: #6B7280;
      --border: #E5E7EB;
      --border-strong: #D1D5DB;
      --success-soft: #D1FAE5;
      --success: #10B981;
      --warning-soft: #FEF3C7;
      --warning: #F59E0B;
      --radius: 10px;
      --font: Inter, "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: #e5e7eb;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px;
    }
    .phone {
      width: 390px;
      min-height: 780px;
      background: var(--canvas);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.15);
      display: flex;
      flex-direction: column;
    }
    .top {
      background: var(--primary);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
    .brand { font-family: "Segoe Script", cursive; font-size: 18px; }
    .main { flex: 1; padding: 16px; overflow: auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .card {
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(31,41,55,.08);
      padding: 16px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 12px; font-weight: 500; margin: 12px 0 6px; }
    label:first-child { margin-top: 0; }
    select, textarea, input {
      width: 100%;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      background: #fff;
    }
    textarea { min-height: 88px; resize: vertical; }
    .banner {
      background: var(--warning-soft);
      color: #92400e;
      font-size: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .btn {
      flex: 1;
      border: none;
      border-radius: var(--radius);
      padding: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: default;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-outline { background: #fff; border: 1px solid var(--border-strong); color: var(--text); }
    .bottom {
      background: #fff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px 4px 12px;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
    }
    .bottom .active { color: var(--primary); font-weight: 600; }
    .icon { font-size: 16px; display: block; margin-bottom: 2px; }
    .caption {
      max-width: 390px;
      margin: 12px auto 0;
      font-size: 12px;
      color: #4b5563;
      font-family: var(--font);
    }
  </style>
</head>
<body>
  <div>
    <div class="phone" aria-label="Hybrid Client — Capture Intervention">
      <header class="top">
        <span class="brand">GuidelyEdu</span>
        <span>James · Teacher</span>
      </header>
      <main class="main">
        <h1>Capture Intervention</h1>
        <p class="sub">Maya Okonkwo · Year 4 · SEN Support</p>
        <div class="banner">Supports professional judgement — not a statutory decision.</div>
        <div class="card">
          <label for="provision">Provision (Ontology)</label>
          <select id="provision">
            <option>Small-group literacy support</option>
            <option>1:1 reading intervention</option>
            <option>Sensory break protocol</option>
          </select>
          <label for="when">Session</label>
          <input id="when" type="text" value="20 Aug 2026 · 10:15" readonly />
          <label for="notes">What was delivered</label>
          <textarea id="notes">20-minute guided reading; visual timetable used; peer buddy present.</textarea>
          <label for="response">Pupil Response (optional now)</label>
          <textarea id="response" placeholder="Add Pupil Response or record later"></textarea>
          <div class="actions">
            <button type="button" class="btn btn-outline">Save draft</button>
            <button type="button" class="btn btn-primary">Submit</button>
          </div>
        </div>
      </main>
      <nav class="bottom" aria-label="Bottom navigation">
        <div><span class="icon">⌂</span>Home</div>
        <div><span class="icon">☰</span>Pupils</div>
        <div class="active"><span class="icon">＋</span>Capture</div>
        <div><span class="icon">✎</span>Drafts</div>
        <div><span class="icon">⋯</span>More</div>
      </nav>
    </div>
    <p class="caption">Key mock — UJ-1 Teacher capture (Hybrid). Spine wins on conflict.</p>
  </div>
</body>
</html>
